name: Enhancement
description: Propose better highlighting or documentation
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change and why.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size estimate
      options:
        - Small (good first issue candidate)
        - Medium
        - Large
    validations:
      required: false
